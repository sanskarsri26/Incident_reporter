name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Deliberately unset: tests run against the in-memory repository
          # and the deterministic mock LLM/embedding providers, never a
          # real paid API, so CI runs are free and don't need secrets.
          GEMINI_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

      - name: Build
        run: npm run build
